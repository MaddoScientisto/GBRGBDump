name: Publish PicNRec Web Serial Library

on:
  push:
    branches:
      - master
      - develop
    paths:
      - .github/workflows/publish-picnrec-web-serial.yml
      - picnrec-web-serial/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: picnrec-web-serial/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@maddoscientisto'

      - name: Install workspace dependencies
        working-directory: ./picnrec-web-serial
        run: npm ci

      - name: Build library package
        working-directory: ./picnrec-web-serial/packages/picnrec-web-serial
        run: npm run build

      - name: Publish library package
        working-directory: ./picnrec-web-serial/packages/picnrec-web-serial
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}