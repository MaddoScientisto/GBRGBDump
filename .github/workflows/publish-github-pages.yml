name: Publish Static Blazor App

on:
  push:
    branches:
      - master
      - develop
    paths:
      - .github/workflows/publish-github-pages.yml
      - Directory.Build.props
      - GBRGBDump.slnx
      - GBRGBDump.Web.Static/**
      - GBTools.ImageSharp.GameBoyCamera/**
      - GBTools.PicNRec.Serial/**
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-github-pages:
    runs-on: ubuntu-latest
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
          dotnet-version: 10.0.201
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore solution
        run: dotnet restore --locked-mode ./GBRGBDump.slnx

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.2
        with:
          versionSpec: '6.0.x'

      - name: Determine Version
        id: version_step
        uses: gittools/actions/gitversion/execute@v3.1.2

      - name: Update Version
        uses: gittools/actions/gitversion/command@v3.1.2
        with:
          arguments: /updateprojectfiles

      - name: Publish static app
        run: dotnet publish ./GBRGBDump.Web.Static/GBRGBDump.Web.Static.csproj --configuration Release --output publish/github-pages

      - name: Pack GBTools.PicNRec.Serial
        run: dotnet pack ./GBTools.PicNRec.Serial/GBTools.PicNRec.Serial.csproj --configuration Release --output publish/nuget

      - name: Add GitHub Packages NuGet source
        run: dotnet nuget add source --username ${{ github.repository_owner }} --store-password-in-clear-text --password ${{ secrets.GITHUB_TOKEN }} --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Publish GBTools.PicNRec.Serial package
        run: |
          for file in publish/nuget/*.nupkg; do
            dotnet nuget push "$file" --source github --skip-duplicate
          done

      - name: Prepare GitHub Pages payload
        shell: bash
        run: |
          touch publish/github-pages/wwwroot/.nojekyll
          cp publish/github-pages/wwwroot/index.html publish/github-pages/wwwroot/404.html

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4.6.8
        with:
          branch: gh-pages
          folder: publish/github-pages/wwwroot
          clean: true