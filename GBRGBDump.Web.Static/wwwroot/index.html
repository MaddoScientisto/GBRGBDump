<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GBRGBDump Web Static</title>
    <script>
        (function () {
            var repoBasePath = "/GBRGBDump/";
            var currentPath = window.location.pathname || "/";
            var baseHref = currentPath.startsWith(repoBasePath) ? repoBasePath : "/";
            document.write('<base href="' + baseHref + '">');
        })();
    </script>
    <meta name="description" content="Static Blazor app for importing Game Boy Camera files and exporting them from the browser." />
    <script type="importmap"></script>
    <link rel="stylesheet" href="app.css" />
</head>

<body>
    <div id="app">
        <div class="loading-shell">
            <div class="loading-shell__card">
                <div class="loading-shell__dot"></div>
                <p>Loading the static Game Boy Camera exporter...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">x</span>
    </div>

    <script src="downloads.js"></script>
    <script>
        (function () {
            var errorUi = document.getElementById("blazor-error-ui");
            if (!errorUi) {
                return;
            }

            var dismiss = errorUi.querySelector(".dismiss");
            if (dismiss) {
                dismiss.addEventListener("click", function () {
                    errorUi.style.display = "none";
                });
            }
        })();
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
